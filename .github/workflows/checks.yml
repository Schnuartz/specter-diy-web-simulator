name: Simulator checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python3 -m compileall -q web/browser web/tools web/tests
      - name: Install JavaScript dependencies
        run: npm ci --prefix web
      - name: Run simulator unit tests
        run: |
          for test in web/tests/test-*.py; do
            if [[ "$test" == *test-browser-manifest.py ]]; then continue; fi
            python3 "$test"
          done
      - name: Run build-independent JavaScript tests
        run: |
          node web/tests/test-demo-data.mjs
          node web/tests/test-build-provenance.mjs
