name: Publish browser simulator

# The caller repository owns the Build workflow and GitHub Pages site. This
# reusable workflow owns only the simulator-side publisher and is invoked from
# the caller's trusted workflow_run job.
on:
  workflow_call:
    inputs:
      simulator_repository:
        description: Repository containing the simulator tooling
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: specter-pages-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      # This is the calling repository, not the simulator repository. It owns
      # the gh-pages branch and is the trusted source of the event metadata.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check out current trusted simulator publisher
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.simulator_repository }}
          ref: main
          path: simulator-tools
      # A failed PR run may have uploaded no artifacts at all. Its old preview
      # still needs to be removed using only the trusted workflow_run event.
      - name: Download workflow target for successful builds
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/specter-artifacts/target
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name build-target --dir /tmp/specter-artifacts/target
      - name: Download both build artifacts from the same workflow run
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/specter-artifacts/browser /tmp/specter-artifacts/firmware
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name browser-simulator --dir /tmp/specter-artifacts/browser
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name firmware-binaries --dir /tmp/specter-artifacts/firmware
      - name: Prepare GitHub Pages branch
        run: |
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages pages origin/gh-pages
          else
            git worktree add --detach pages
            git -C pages switch --orphan gh-pages
            git -C pages rm -rf . || true
          fi
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify provenance and stage current preview
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 simulator-tools/web/tools/publish_preview.py prepare \
            --event "$GITHUB_EVENT_PATH" \
            --target /tmp/specter-artifacts/target/target.json \
            --browser /tmp/specter-artifacts/browser \
            --firmware /tmp/specter-artifacts/firmware \
            --pages pages --state /tmp/specter-preview-state.json
          if test -f pages/index.html || test -d pages/pr; then
            echo 'has_site=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_site=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish static Pages branch
        run: |
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Update Specter browser preview from run ${{ github.event.workflow_run.id }}"
            git -C pages push origin HEAD:gh-pages
          fi
      - name: Stage a clean static Pages artifact
        if: steps.prepare.outputs.has_site == 'true'
        run: python3 -c "import shutil; shutil.copytree('pages', 'site-dist', ignore=shutil.ignore_patterns('.git'))"
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.has_site == 'true'
        with:
          path: site-dist
      - uses: actions/deploy-pages@v4
        if: steps.prepare.outputs.has_site == 'true'
      - name: Replace the single PR build comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 simulator-tools/web/tools/publish_preview.py comment --state /tmp/specter-preview-state.json
